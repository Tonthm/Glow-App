<!DOCTYPE html>
<html lang="th">
<head>
  <!-- Filled in by `flutter build web` from the base-href option. -->
  <base href="/Glow-App/">

  <meta charset="UTF-8">
  <meta name="description" content="Glow วางแผนเวลานอนจากตารางเรียน">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" media="(prefers-color-scheme: light)" content="#FBF9FF">
  <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#13111B">

  <!-- Home screen app on iOS -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Glow">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">

  <link rel="icon" type="image/png" href="favicon.png">
  <title>Glow</title>
  <link rel="manifest" href="manifest.json">

  <style>
    body { background: #FBF9FF; }
    @media (prefers-color-scheme: dark) { body { background: #13111B; } }

    /* The logo while the app loads. */
    #glow-splash {
      position: fixed;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      pointer-events: none;
    }
    #glow-splash img { width: 128px; height: 128px; border-radius: 28px; }
  </style>
</head>
<body>
  <div id="glow-splash"><img src="icons/Icon-512.png" alt="Glow"></div>
  <script>
    window.addEventListener('flutter-first-frame', function () {
      var splash = document.getElementById('glow-splash');
      if (splash) splash.remove();
    });
  </script>
  <script>
    // Registers the offline cache and tells the app when a newer version is
    // waiting. The app calls the two glow* functions.
    (function () {
      var waiting = null;
      var reloadWanted = false;
      window.glowUpdateReady = function () { return waiting !== null; };
      window.glowApplyUpdate = function () {
        if (!waiting) return;
        reloadWanted = true;
        waiting.postMessage('SKIP_WAITING');
      };
      if (!('serviceWorker' in navigator)) return;

      navigator.serviceWorker.addEventListener('controllerchange', function () {
        if (reloadWanted) window.location.reload();
      });

      window.addEventListener('load', function () {
        navigator.serviceWorker
          .register('sw.js', { updateViaCache: 'none' })
          .then(function (registration) {
            // With no controller this is the first install, not an update.
            function noteIfUpdate(worker) {
              if (worker && navigator.serviceWorker.controller) {
                waiting = worker;
              }
            }
            noteIfUpdate(registration.waiting);
            registration.addEventListener('updatefound', function () {
              var worker = registration.installing;
              worker.addEventListener('statechange', function () {
                if (worker.state === 'installed') noteIfUpdate(worker);
              });
            });
            // A home screen app can stay open for days.
            document.addEventListener('visibilitychange', function () {
              if (document.visibilityState === 'visible') {
                registration.update().catch(function () {});
              }
            });
          })
          .catch(function () {});
      });
    })();
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
